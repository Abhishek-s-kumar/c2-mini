[project]
name = C2 Beacon Detection System
version = 1.0.0
author = Security Research Team

[detection]
p_score_threshold = 0.7
analysis_interval = 30
monitoring_duration = 300

[network]
interface = enp0s8
beacon_ip = 192.168.56.20
monitored_subnet = 192.168.56.0/24

[paths]
logs_dir = logs/
output_dir = output/
reports_dir = reports/
